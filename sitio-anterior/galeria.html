<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - E.P.S Agraria n°1 Alte. Brown</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body id="inicio">
    <header class="header">
        <a href='/'>
           <img class="header__logo" src="img/Horticultura.jpg" alt="logotipo">
        </a>
    </header>

    <nav class="navegacion">
        <a class='navegacion__enlace' href="cultivos.html">Cultivos</a>
        <a class='navegacion__enlace' href="biopreparados.html">biopreparados</a>
        <a class='navegacion__enlace' href="nosotros.html">NOSOTROS</a>
        <a class='navegacion__enlace' href="novedades.html">Novedades</a>
        <a class='navegacion__enlace navegacion__enlace--activo' href="galeria.html">Galería</a>
    </nav>

<main class="contenedor">
    <h1>Galería</h1>
    <p class="galeria__intro">Las fotos y videos de nuestro Instagram
        <a href="https://www.instagram.com/epsagraria/" target="_blank" rel="noopener">@epsagraria</a>.</p>

    <!-- Se completa con js/galeria.js -->
    <div class="galeria" id="galeria"></div>
    <div class="galeria__mas">
        <button type="button" id="cargarMas" hidden>Ver más</button>
    </div>
</main>

<!-- Vista ampliada de un posteo -->
<dialog class="visor" id="visor" aria-label="Posteo de Instagram">
    <button type="button" class="visor__cerrar" id="visorCerrar" aria-label="Cerrar">&times;</button>
    <div class="visor__medio" id="visorMedio"></div>
    <div class="visor__flechas" id="visorFlechas" hidden>
        <button type="button" id="visorAnterior" aria-label="Anterior">&#8249;</button>
        <span id="visorPosicion"></span>
        <button type="button" id="visorSiguiente" aria-label="Siguiente">&#8250;</button>
    </div>
    <div class="visor__texto">
        <p class="visor__fecha" id="visorFecha"></p>
        <p class="visor__caption" id="visorCaption"></p>
        <a class="visor__enlace" id="visorEnlace" target="_blank" rel="noopener">
            <i class="fab fa-instagram"></i> Ver en Instagram
        </a>
    </div>
</dialog>

<footer>
    <div class="footer-contenido">

        <a href="#inicio" class="btn-inicio">
            Volver al Inicio
        </a>

        <p>&copy; 2025, E.P.S Agraria n°1/C.E.A 34 Alte.Brown</p>

        <div class="redes-sociales">
            <a href="https://www.instagram.com/epsagraria/" target="_blank" rel="noopener" aria-label="Síguenos en Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <p>¡Seguinos en nuestro instagram!</p>
        </div>
    </div>
</footer>
<script type="module" src="js/galeria.js"></script>
</body>
</html>
